name: worker-cicd

# Cloudflare Workers プロダクトのアプリ CI/CD。プロダクトのリポジトリから
# @v1 で参照する。
#
# 中身は infra 領域(Cloudflare)に属する。ここに置いてあるのは GitHub が他リポジトリ
# からの参照先を .github/workflows/ 直下に限定しているためであり、設計と使い方は
# templates/infra/ にある。
#
#   jobs:
#     cicd:
#       uses: uyaaaaaa/platform/.github/workflows/worker-cicd.yml@v1
#       secrets: inherit
#
# PR で test → preview、main へのマージで production まで自動で進む。承認ステップは
# 置かない(単独開発では自己承認のセレモニーにしかならない)。ガードは人間ではなく
# 機械検査として guard job に置く。

on:
  workflow_call:
    inputs:
      working-directory:
        description: Worker のパッケージの位置。モノレポでは worker。
        type: string
        default: '.'
      node-version:
        description: |
          Node のバージョン。プラットフォームはツールチェーンを規約化しないため、
          これは既定値であってプロダクトが上書きしてよい。
        type: string
        default: '22'
      enable-d1:
        description: |
          D1 を使うか。Terraform module の enable_d1 と揃える。有効にすると
          マイグレーションの適用と、production 適用前のエクスポートが付く。
        type: boolean
        default: false
      d1-binding:
        description: wrangler 設定での D1 の binding 名。データベース名は Terraform が生成するため、CI は binding 越しに参照する。
        type: string
        default: DB
      migrations-dir:
        description: マイグレーションの位置(working-directory からの相対)。
        type: string
        default: migrations
      backup-bucket:
        description: マイグレーション適用前のエクスポートを置く R2 バケット名。enable-d1 のとき必須。
        type: string
        default: ''
      secret-prefix:
        description: |
          Cloudflare へ同期する GitHub Secrets のプレフィックス。同期時に
          プレフィックスは外す(APP_SECRET_STRIPE_KEY → STRIPE_KEY)。
        type: string
        default: APP_SECRET_
      wrangler-version:
        description: プロダクトが wrangler を依存に持たない場合に使うバージョン。
        type: string
        default: '4'

# 呼び出し側には secrets: inherit を要求する。同期対象のシークレットは
# プレフィックスで機械判定するため、ここで列挙できないからである。必須シークレット
# の有無は guard job が実行時に検査する。

permissions:
  contents: read

jobs:
  # git hooks(templates/github/githooks/)と同等の検査。hooks は参照配布できず、
  # --no-verify で迂回もできるため、強制すべきものは CI を正とする。両者は同じ規則の
  # 二重実装であり、片方を変えたらもう片方も変える。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 秘密情報の検査は PR の差分だけを対象にするため、base が要る。
          fetch-depth: 0

      - name: D1 を使う場合にバックアップ先が指定されていること
        env:
          ENABLE_D1: ${{ inputs.enable-d1 }}
          BACKUP_BUCKET: ${{ inputs.backup-bucket }}
        run: |
          set -eu
          # 退避先が無いまま production のマイグレーションに到達させない。落とすなら
          # 本番適用の直前ではなく PR の時点である。
          if [ "$ENABLE_D1" = 'true' ] && [ -z "$BACKUP_BUCKET" ]; then
            echo "guard: enable-d1 が true のとき backup-bucket は必須です。" >&2
            exit 1
          fi

      - name: PR タイトルが Conventional Commits であること
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # 式を run に直接展開しない(タイトルは外部入力である)。
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          # squash merge により main の各コミット件名は PR タイトルになる。
          # commit-msg hook が検証するのはローカルのコミットであり、main の履歴に
          # 残る件名を検証できるのはここだけである。
          types='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "^($types)(\([a-z0-9._/-]+\))?!?: .+"; then
            echo "guard: PR タイトルが Conventional Commits 形式ではありません。" >&2
            echo "  実際: $PR_TITLE" >&2
            echo "  形式: <type>[(scope)][!]: <description>" >&2
            echo "  type: $types" >&2
            exit 1
          fi
          # wc -m はロケールによってバイト数を返し判定が揺れる。
          max=72
          len=$(printf '%s' "$PR_TITLE" | LC_ALL=C tr -d '\200-\277' | wc -c | tr -d ' ')
          if [ "$len" -gt "$max" ]; then
            echo "guard: PR タイトルが ${max} 文字を超えています (${len} 文字)。" >&2
            exit 1
          fi

      - name: 秘密情報らしき文字列が追加されていないこと
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          # 規則は templates/github/githooks/pre-commit と同じものである。hooks は
          # --no-verify で迂回できるため、CI 側にも同じ検査を置く。
          secret='gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|sk-[A-Za-z0-9_-]{32,}|(AKIA|ASIA)[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          placeholder='x{4,}|example|placeholder|change_?me|dummy'

          base=$(git merge-base "origin/$BASE_REF" HEAD)

          # 変更点を一度ファイルへ出す。パイプの while はサブシェルで走るため、
          # ループ内で立てた印が外へ残らない。
          changed="$RUNNER_TEMP/changed-files.txt"
          # quotePath を切らないと、非 ASCII のファイル名が "\346..." に化けて
          # 続く git diff が空振りし、検査を素通りする。
          git -c core.quotePath=false diff --name-only --diff-filter=ACM "$base" HEAD > "$changed"

          status=0
          # 検査対象は追加行のみ。既存行は公開済みであり、ここで止めても手遅れである。
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              *.example|*.sample|*.template) continue ;;
              .env|.env.*|*/.env|*/.env.*)
                echo "guard: 環境変数ファイルが含まれています: $file" >&2
                status=1
                continue
                ;;
            esac

            hits=$(git diff -U0 "$base" HEAD -- "$file" | grep '^+' | grep -v '^+++' | grep -E "$secret" | grep -ivE "$placeholder" || true)
            if [ -n "$hits" ]; then
              echo "guard: 秘密情報らしき文字列を検出しました: $file" >&2
              status=1
            fi
          done < "$changed"
          exit "$status"

      - name: --env なしのデプロイが書かれていないこと
        run: |
          set -eu
          # 環境サフィックスなしのルート Worker を作らないという規約(templates/infra/design.md)
          # の強制。CI 自身は常に --env を渡すが、プロダクト側の npm script や
          # 独自ワークフローから素の wrangler deploy が走ると規約が抜ける。
          # 対象は呼び出し箇所だけに絞る。文書中の記述まで落とすと、規約を説明する
          # ために規約を破ったことにされる。
          hits=$(grep -rnE 'wrangler[[:space:]]+(deploy|versions[[:space:]]+upload)' \
                   --include=package.json --include=Makefile \
                   --include='*.sh' --include='*.yml' --include='*.yaml' \
                   --exclude-dir=.git --exclude-dir=node_modules . \
                 | grep -v -- '--env' || true)
          if [ -n "$hits" ]; then
            echo "guard: --env を伴わない wrangler deploy があります。" >&2
            printf '%s\n' "$hits" >&2
            echo "  デプロイは常に --env preview / --env production を指定してください。" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - run: npm ci

      # コマンド名がプラットフォームとプロダクトのインターフェースである
      # (docs/design.md ローカル開発)。中身はプロダクトが決める。
      - run: npm run test

      - name: wrangler を解決する
        env:
          WRANGLER_VERSION: ${{ inputs.wrangler-version }}
        run: |
          set -eu
          if [ -x node_modules/.bin/wrangler ]; then
            echo "WRANGLER=$(pwd)/node_modules/.bin/wrangler" >> "$GITHUB_ENV"
          else
            echo "WRANGLER=npx --yes wrangler@$WRANGLER_VERSION" >> "$GITHUB_ENV"
          fi

      - name: 両環境にデプロイ可能であること
        run: |
          set -eu
          # --dry-run は認証を必要としない。ここで落ちるのは wrangler 設定に
          # env.preview / env.production が無い場合とバンドルに失敗した場合であり、
          # どちらもデプロイまで持ち越す理由がない。
          for env in preview production; do
            $WRANGLER deploy --env "$env" --dry-run --outdir "$RUNNER_TEMP/dry-run-$env"
          done

  deploy-preview:
    if: ${{ github.event_name == 'pull_request' }}
    needs: [guard, test]
    runs-on: ubuntu-latest
    environment: preview
    # PR に新しい push が来たら古いデプロイは無駄になる。preview は使い捨てであり
    # 途中で止めて困るものが無い。
    concurrency:
      group: worker-cicd-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # 検査を guard ではなくここへ置くのは、Environment のシークレットが
      # environment を宣言した job からしか見えないためである。guard で見ると、
      # 環境ごとに登録した正しい構成を不足と誤判定する。
      - name: 必須シークレットが揃っていること
        run: |
          set -eu
          missing=''
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "シークレットが不足しています:$missing" >&2
            echo "  呼び出し側で secrets: inherit を指定し、リポジトリまたは Environment に登録してください。" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - run: npm ci

      - name: wrangler を解決する
        env:
          WRANGLER_VERSION: ${{ inputs.wrangler-version }}
        run: |
          set -eu
          if [ -x node_modules/.bin/wrangler ]; then
            echo "WRANGLER=$(pwd)/node_modules/.bin/wrangler" >> "$GITHUB_ENV"
          else
            echo "WRANGLER=npx --yes wrangler@$WRANGLER_VERSION" >> "$GITHUB_ENV"
          fi

      - name: マイグレーションの有無を調べる
        id: migrations
        if: ${{ inputs.enable-d1 }}
        env:
          MIGRATIONS_DIR: ${{ inputs.migrations-dir }}
        run: |
          set -eu
          if [ -n "$(find "$MIGRATIONS_DIR" -name '*.sql' -print -quit 2>/dev/null)" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi

      - name: D1 マイグレーションを適用する
        if: ${{ steps.migrations.outputs.found == 'true' }}
        env:
          D1_BINDING: ${{ inputs.d1-binding }}
        run: |
          set -eu
          # preview の主目的はここである。スキーマ変更はコードと違い
          # ロールバックできないため、production の前に必ず一度通す。
          # preview のデータは使い捨てであり、事前の退避は行わない。
          $WRANGLER d1 migrations apply "$D1_BINDING" --env preview --remote

      - name: preview へデプロイする
        run: |
          set -eu
          $WRANGLER deploy --env preview

      - name: シークレットを同期する
        env:
          # secrets: inherit で渡ってきた全シークレット。値は GitHub がログ上で
          # マスクする。プレフィックスに合致するものだけを Cloudflare へ送る。
          ALL_SECRETS: ${{ toJSON(secrets) }}
          SECRET_PREFIX: ${{ inputs.secret-prefix }}
        run: |
          set -eu
          # デプロイの後に置く。Worker が存在しない状態では secret put が
          # 失敗するためである。secret put 自体が新しいバージョンを作るので、
          # 同期した値は直後のリクエストから有効になる。
          names=$(printf '%s' "$ALL_SECRETS" | jq -r --arg p "$SECRET_PREFIX" 'keys[] | select(startswith($p))')
          if [ -z "$names" ]; then
            echo "同期対象のシークレットはありません。"
            exit 0
          fi
          for name in $names; do
            target=${name#"$SECRET_PREFIX"}
            # jq -r は末尾に改行を足す。コマンド置換で落としてから渡さないと、
            # 改行を含んだ値が Cloudflare 側に入る。
            value=$(printf '%s' "$ALL_SECRETS" | jq -r --arg k "$name" '.[$k]')
            printf '%s' "$value" | $WRANGLER secret put "$target" --env preview
            echo "synced: $target"
          done

  deploy-production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [guard, test]
    runs-on: ubuntu-latest
    environment: production
    # マイグレーションの途中で打ち切られると、適用済みの範囲が不明な状態が残る。
    # 待たせることはあっても止めはしない。
    concurrency:
      group: worker-cicd-production-${{ github.repository }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # 検査を guard ではなくここへ置くのは、Environment のシークレットが
      # environment を宣言した job からしか見えないためである。guard で見ると、
      # 環境ごとに登録した正しい構成を不足と誤判定する。
      - name: 必須シークレットが揃っていること
        run: |
          set -eu
          missing=''
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "シークレットが不足しています:$missing" >&2
            echo "  呼び出し側で secrets: inherit を指定し、リポジトリまたは Environment に登録してください。" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - run: npm ci

      - name: wrangler を解決する
        env:
          WRANGLER_VERSION: ${{ inputs.wrangler-version }}
        run: |
          set -eu
          if [ -x node_modules/.bin/wrangler ]; then
            echo "WRANGLER=$(pwd)/node_modules/.bin/wrangler" >> "$GITHUB_ENV"
          else
            echo "WRANGLER=npx --yes wrangler@$WRANGLER_VERSION" >> "$GITHUB_ENV"
          fi

      - name: マイグレーションの有無を調べる
        id: migrations
        if: ${{ inputs.enable-d1 }}
        env:
          MIGRATIONS_DIR: ${{ inputs.migrations-dir }}
        run: |
          set -eu
          # 未適用のものだけを選り分けない。破壊的 SQL の静的検査は網羅できず、
          # 守るのは検出ではなく復旧可能性であるため、迷ったら退避する側に倒す
          # (templates/infra/design.md CI/CD)。migrations apply は適用済みなら何もしない。
          if [ -n "$(find "$MIGRATIONS_DIR" -name '*.sql' -print -quit 2>/dev/null)" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi

      - name: 適用前の D1 を R2 へ退避する
        if: ${{ steps.migrations.outputs.found == 'true' }}
        env:
          D1_BINDING: ${{ inputs.d1-binding }}
          BACKUP_BUCKET: ${{ inputs.backup-bucket }}
          # バックアップ用バケットに限定したトークンがあれば使う。無ければ
          # デプロイ用トークンで代替する(templates/infra/design.md 権限とシークレット)。
          BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -eu
          # エクスポート内容はログにも artifact にも残さない。プラットフォームは
          # 格納データの機微性を判断できないため、常に残さない側に倒す。
          # 出力先を作業ツリーの外に置き、後続の step から拾えないようにする。
          out="$RUNNER_TEMP/d1-pre-migration.sql"
          trap 'rm -f "$out"' EXIT
          $WRANGLER d1 export "$D1_BINDING" --env production --remote --output "$out"

          key="d1/$REPOSITORY_NAME/pre-migration/$(date -u +%Y%m%dT%H%M%SZ)-$GITHUB_SHA.sql"
          CLOUDFLARE_API_TOKEN="${BACKUP_TOKEN:-$DEPLOY_TOKEN}" \
            $WRANGLER r2 object put "$BACKUP_BUCKET/$key" --file "$out" --remote
          echo "backup: r2://$BACKUP_BUCKET/$key"

      - name: D1 マイグレーションを適用する
        if: ${{ steps.migrations.outputs.found == 'true' }}
        env:
          D1_BINDING: ${{ inputs.d1-binding }}
        run: |
          set -eu
          # CI が npm run db:migrate を呼ばないのは、対象の環境(--env)と
          # 実体への適用(--remote)を CI 側が決める必要があるためである。
          # npm script はローカル開発のインターフェースであり、用途が違う。
          $WRANGLER d1 migrations apply "$D1_BINDING" --env production --remote

      - name: production へデプロイする
        run: |
          set -eu
          $WRANGLER deploy --env production

      - name: シークレットを同期する
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          SECRET_PREFIX: ${{ inputs.secret-prefix }}
        run: |
          set -eu
          names=$(printf '%s' "$ALL_SECRETS" | jq -r --arg p "$SECRET_PREFIX" 'keys[] | select(startswith($p))')
          if [ -z "$names" ]; then
            echo "同期対象のシークレットはありません。"
            exit 0
          fi
          for name in $names; do
            target=${name#"$SECRET_PREFIX"}
            value=$(printf '%s' "$ALL_SECRETS" | jq -r --arg k "$name" '.[$k]')
            printf '%s' "$value" | $WRANGLER secret put "$target" --env production
            echo "synced: $target"
          done
